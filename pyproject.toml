[project]
name = "minecraft-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=4.0.3",
    "pyclassic",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.sources]
pyclassic = { git = "https://github.com/pyclassic/pyclassic.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "mcp_server"]
